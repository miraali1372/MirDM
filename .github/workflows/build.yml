name: Build & Test MirDM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore MirDM.sln

    - name: Build Solution
      run: dotnet build MirDM.sln -c Release --no-restore

    - name: Run Engine Tests
      run: dotnet run --project src/MirDM.csproj -c Release --no-build -- --test
