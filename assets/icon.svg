<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>

    <!-- Bolt Inner Glow -->
    <linearGradient id="boltInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </linearGradient>

    <!-- Arrow Head Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Speed Chevron Gradients -->
    <linearGradient id="chev1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="chev2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Metallic/Acrylic Depth -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Inner Soft Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" ry="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

  <!-- Cybernetic Grid / Speed Ring Elements -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-opacity="0.07" stroke-width="1.5" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#7928ca" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="16 20" />

  <!-- Background Quantum Download Funnel Chevrons -->
  <g opacity="0.6">
    <!-- Top Speed Dash -->
    <path d="M 180 120 L 256 160 L 332 120" fill="none" stroke="url(#chev2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 160 170 L 256 220 L 352 170" fill="none" stroke="url(#chev1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  </g>

  <!-- High-Energy Glow Layer (Behind Core) -->
  <g filter="url(#neonGlow)">
    <!-- Stylized Central Lightning / Quantum Download Arrow -->
    <path d="M 280 84 
             L 165 248 
             L 242 248 
             L 204 380 
             L 340 216 
             L 264 216 
             Z" 
          fill="url(#boltGrad)" opacity="0.9" />

    <!-- Bottom Ultra-Speed Arrowhead Anchor -->
    <path d="M 180 370 L 256 426 L 332 370" fill="none" stroke="#00f2fe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 210 412 L 256 448 L 302 412" fill="none" stroke="#4facfe" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sharp Core Foreground Lightning Bolt -->
  <g filter="url(#coreGlow)">
    <path d="M 280 84 
             L 165 248 
             L 242 248 
             L 204 380 
             L 340 216 
             L 264 216 
             Z" 
          fill="url(#boltGrad)" />

    <!-- White-hot Electric Core Spine -->
    <path d="M 276 96 
             L 182 244 
             L 246 244 
             L 218 360 
             L 322 224 
             L 260 224 
             Z" 
          fill="url(#boltInner)" opacity="0.75" />

    <!-- Sharp Bottom Arrowhead Target -->
    <path d="M 180 370 L 256 426 L 332 370" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 210 412 L 256 448 L 302 412" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Quantum Particles / Data Packets (Parallel Acceleration Dots) -->
  <circle cx="150" cy="150" r="4" fill="#00f2fe" opacity="0.8" filter="url(#coreGlow)" />
  <circle cx="360" cy="140" r="5" fill="#7928ca" opacity="0.8" filter="url(#coreGlow)" />
  <circle cx="380" cy="320" r="4.5" fill="#00f2fe" opacity="0.7" filter="url(#coreGlow)" />
  <circle cx="130" cy="330" r="3.5" fill="#b5179e" opacity="0.7" filter="url(#coreGlow)" />
  <circle cx="256" cy="466" r="3.5" fill="#00f2fe" opacity="0.9" filter="url(#coreGlow)" />
</svg>
